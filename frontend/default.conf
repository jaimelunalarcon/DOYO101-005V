server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;
    # Relativo: el contenedor escucha en :80 y el host publica :8080.
    absolute_redirect off;

    # Productos + alta: una sola página
    location = /productos {
        try_files /index.html =404;
    }

    # Reporte de inventario: página aparte
    location = /reporte {
        try_files /reporte.html =404;
    }

    # La raíz abre la página de productos
    location = / {
        return 302 /productos;
    }

    # Archivos estáticos (css/js). Sin fallback a index: cada URL es una página.
    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy al backend Express (CRUD productos)
    # 127.0.0.11 = DNS interno de Docker (re-resuelve si el servicio reinicia)
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy al reporting-service FastAPI (mismas rutas /reports/*)
    location /reports/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $reporting_upstream http://reporting-service:8000;
        proxy_pass $reporting_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
