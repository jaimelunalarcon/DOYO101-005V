name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests-backend:
    name: tests-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest with coverage
        run: npm run test:coverage

  tests-reporting:
    name: tests-reporting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reporting-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            reporting-service/requirements.txt
            reporting-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run PyTest with coverage
        run: pytest -v

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: [tests-backend, tests-reporting]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar estructura del proyecto
        run: |
          test -f frontend/index.html
          test -f frontend/app.js
          test -f frontend/Dockerfile
          test -f backend/server.js
          test -f backend/package.json
          test -f backend/Dockerfile
          test -f db/init.sql
          test -f db/Dockerfile
          test -f reporting-service/Dockerfile
          test -f reporting-service/requirements.txt
          test -f docker-compose.yml

      - name: Validar Docker Compose
        run: docker compose config --quiet

      - name: Build imágenes Docker
        run: docker compose build
