<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Productos · Tienda de Alimentos para Perritos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>Tienda de Alimentos para Perritos &#128054;</h1>
    <p>Gestión de productos</p>
    <nav aria-label="Secciones principales">
      <a href="/productos" class="active" aria-current="page">Productos</a>
      <a href="/reporte">Reporte</a>
    </nav>
  </header>
  <main>
    <section id="seccion-productos" class="card" aria-labelledby="titulo-productos">
      <h2 id="titulo-productos">Productos</h2>
      <div class="actions">
        <button id="btnCargar" type="button">Cargar Productos</button>
      </div>
      <table>
        <thead>
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Nombre</th>
            <th scope="col">Descripción</th>
            <th scope="col">Precio</th>
            <th scope="col">Stock</th>
            <th scope="col">Acciones</th>
          </tr>
        </thead>
        <tbody id="tbodyProductos">
        </tbody>
      </table>
    </section>

    <section id="seccion-nuevo-producto" class="card" aria-labelledby="formTitle">
      <h2 id="formTitle">Nuevo producto</h2>
      <div class="form-grid">
        <div>
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Ej: Alimento Premium Cachorro" />
        </div>
        <div>
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" rows="2" placeholder="Ej: Sabor pollo, razas pequeñas"></textarea>
        </div>
        <div>
          <label for="precio">Precio</label>
          <input type="number" id="precio" step="0.01" min="0" placeholder="Ej: 19990" />
        </div>
        <div>
          <label for="stock">Stock</label>
          <input type="number" id="stock" min="0" placeholder="Ej: 10" />
        </div>
      </div>
      <div class="actions" style="margin-top: 12px;">
        <button id="btnGuardar" type="button">Guardar</button>
        <button id="btnCancelar" class="secondary" type="button">Cancelar</button>
      </div>
      <div id="status" class="status" role="status"></div>
    </section>
  </main>

  <script src="/common.js"></script>
  <script src="/productos.js"></script>
</body>
</html>
