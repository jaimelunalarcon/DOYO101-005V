# SonarQube Cloud — configuración de análisis (EP2)
sonar.organization=jaimelunalarcon
sonar.projectKey=jaimelunalarcon_DOYO101-005V

sonar.projectName=Tienda de Alimentos para Perritos
sonar.projectVersion=1.0

# Fuentes de producción (sin carpetas de tests para evitar solapes)
sonar.sources=backend/server.js,frontend,reporting-service/app,db
sonar.tests=backend/tests,reporting-service/tests
sonar.test.inclusions=**/tests/**/*,**/test_*.py,**/*.test.js

# Python alineado a imagen de producción 3.12.8
sonar.python.version=3.12

# Encoding
sonar.sourceEncoding=UTF-8

# Reportes de cobertura generados en CI (rutas relativas a la raíz del repo)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.python.coverage.reportPaths=reporting-service/coverage.xml

# Excluir dependencias, cachés, entornos y artefactos generados
sonar.exclusions=\
**/node_modules/**,\
**/.venv/**,\
**/venv/**,\
**/__pycache__/**,\
**/.pytest_cache/**,\
**/coverage/**,\
**/htmlcov/**,\
**/.coverage,\
**/coverage.xml,\
**/*.lcov,\
**/package-lock.json,\
**/.DS_Store,\
**/dist/**,\
**/build/**,\
**/Dockerfile,\
**/jest.config.js,\
**/pytest.ini,\
**/requirements*.txt

# No medir cobertura sobre tests ni sobre el JS del navegador.
# Esos scripts no tienen suite unitaria (los ejercita scripts/e2e-reporting.sh).
# Si entran en new_coverage, el Quality Gate del PR queda en 0%.
sonar.coverage.exclusions=\
**/tests/**,\
**/test_*.py,\
**/*.test.js,\
frontend/**/*.js
