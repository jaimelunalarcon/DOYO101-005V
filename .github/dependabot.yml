# Dependabot: actualizaciones semanales de dependencias y Actions.
# Complementa (no reemplaza) el Security Gate del workflow CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm

  - package-ecosystem: pip
    directory: /reporting-service
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    groups:
      python-test-runners:
        patterns:
          - pytest
          - pytest-asyncio

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
