name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  tests-backend:
    name: tests-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v7
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest with coverage
        run: npm run test:coverage

      - name: Upload backend coverage (LCOV)
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          if-no-files-found: error

  tests-reporting:
    name: tests-reporting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reporting-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            reporting-service/requirements.txt
            reporting-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run PyTest with coverage
        run: pytest -v

      - name: Upload reporting coverage (Cobertura XML)
        uses: actions/upload-artifact@v4
        with:
          name: reporting-coverage
          path: reporting-service/coverage.xml
          if-no-files-found: error

  # Security Gate: npm audit + pip-audit + Trivy (sin token Snyk).
  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18 (para npm audit)
        uses: actions/setup-node@v7
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: npm audit (falla solo en HIGH/CRITICAL)
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Setup Python 3.12 (para pip-audit)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            reporting-service/requirements.txt
            reporting-service/requirements-dev.txt

      # pip-audit resuelve transitivas. Bloquea ante CUALQUIER vulnerabilidad
      # del grafo de requirements.txt (no filtra HIGH/CRITICAL como Trivy).
      - name: pip-audit (dependencias Python directas y transitivas)
        working-directory: reporting-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit
          pip-audit -r requirements.txt

      - name: Trivy FS — backend (HIGH/CRITICAL bloquean)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          ignore-unfixed: false

      - name: Trivy FS — reporting-service (HIGH/CRITICAL bloquean)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: reporting-service
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          ignore-unfixed: false

      - name: Trivy FS — resumen LOW/MEDIUM (no bloquea)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM
          exit-code: "0"
          format: table
          ignore-unfixed: false

  sonarqube-analysis:
    name: sonarqube-analysis
    runs-on: ubuntu-latest
    needs: [tests-backend, tests-reporting]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Download reporting coverage
        uses: actions/download-artifact@v4
        with:
          name: reporting-coverage
          path: reporting-service

      - name: Normalizar rutas de cobertura para Sonar
        run: |
          set -euo pipefail
          test -f backend/coverage/lcov.info
          test -f reporting-service/coverage.xml

          # Jest genera SF:server.js (cwd=backend); Sonar espera ruta desde la raíz del repo
          sed -i 's|^SF:server.js$|SF:backend/server.js|' backend/coverage/lcov.info
          grep -q '^SF:backend/server.js$' backend/coverage/lcov.info

          # Cobertura Python relativa (app/...) → prefijo reporting-service/
          python3 <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          xml_path = Path("reporting-service/coverage.xml")
          tree = ET.parse(xml_path)
          root = tree.getroot()

          for source in root.findall("sources/source"):
              if source.text:
                  source.text = "reporting-service"

          for cls in root.findall(".//class"):
              filename = cls.attrib.get("filename", "")
              if filename and not filename.startswith("reporting-service/"):
                  if filename.startswith("app/"):
                      cls.set("filename", f"reporting-service/{filename}")
                  else:
                      cls.set("filename", f"reporting-service/app/{filename}")

          tree.write(xml_path, encoding="utf-8", xml_declaration=True)
          print("coverage.xml paths normalized")
          PY

      # SonarCloud Free: la API de Quality Gate solo está disponible para la rama
      # main y para análisis de Pull Request. En push a develop/feature,
      # -Dsonar.qualitygate.wait=true falla con:
      # "Organization is not allowed to access data from non main branches".
      - name: Resolver espera de Quality Gate
        id: sonar_qg
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "args=-Dsonar.qualitygate.wait=true" >> "$GITHUB_OUTPUT"
            echo "Quality Gate obligatorio (PR o main)."
          else
            echo "args=-Dsonar.qualitygate.wait=false" >> "$GITHUB_OUTPUT"
            echo "Quality Gate wait desactivado en '${{ github.ref_name }}' (limitación SonarCloud Free). El análisis sí se ejecuta."
          fi

      - name: SonarQube Cloud Scan + Quality Gate
        uses: SonarSource/sonarqube-scan-action@v5.3.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: ${{ steps.sonar_qg.outputs.args }}

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: [tests-backend, tests-reporting, security-scan, sonarqube-analysis]
    # Credenciales ficticias del stack efímero de CI (config, build y E2E).
    # No son secretos reales ni se usan como credenciales de producción.
    env:
      MYSQL_ROOT_PASSWORD: ci-only-root-not-for-production
      MYSQL_PASSWORD: ci-only-app-not-for-production
      DB_USER: alumno
      DB_PASSWORD: ci-only-app-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar estructura del proyecto
        run: |
          test -f frontend/index.html
          test -f frontend/reporte.html
          test -f frontend/styles.css
          test -f frontend/common.js
          test -f frontend/productos.js
          test -f frontend/reporte.js
          test -f frontend/Dockerfile
          test -f backend/server.js
          test -f backend/package.json
          test -f backend/Dockerfile
          test -f db/init.sql
          test -f db/Dockerfile
          test -f reporting-service/Dockerfile
          test -f reporting-service/requirements.txt
          test -f docker-compose.yml
          test -f scripts/e2e-reporting.sh
          test -f .github/dependabot.yml
          test -f sonar-project.properties

      - name: Validar Docker Compose
        run: docker compose config --quiet

      - name: Build imágenes Docker
        run: docker compose build

      - name: Levantar stack para integración E2E
        run: docker compose up -d

      - name: Integración E2E (Nginx, Express, FastAPI, MySQL)
        env:
          TIMEOUT_SEC: "180"
        run: bash scripts/e2e-reporting.sh

      - name: Limpiar contenedores y volúmenes de CI
        if: always()
        run: docker compose down --remove-orphans --volumes
